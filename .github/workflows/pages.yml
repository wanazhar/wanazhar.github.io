name: Deploy monorepo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Emir's Car World
        working-directory: _emir-src
        run: |
          npm ci
          npm run build

      - name: Build Endless Runner
        working-directory: _endlessrunner-src
        run: |
          npm ci
          npm run build

      - name: Build Kuala Lumpur
        working-directory: _kualalumpur-src
        run: |
          npm ci
          npm run build

      - name: Build Apex GP
        working-directory: _f1-src
        run: |
          npm ci
          npm run build

      # spacebunnyalpha: dev dependencies carry the jsdom-based runtime test,
      # so install them explicitly rather than relying on the ambient NODE_ENV.
      - name: Install spacebunnyalpha
        working-directory: _spacebunnyalpha-src
        run: npm ci --include=dev

      - name: Build spacebunnyalpha
        working-directory: _spacebunnyalpha-src
        run: npm run build

      - name: Test spacebunnyalpha
        working-directory: _spacebunnyalpha-src
        run: npm test

      - name: Lint spacebunnyalpha
        working-directory: _spacebunnyalpha-src
        run: npm run lint

      - name: Validate spacebunnyalpha world budget
        working-directory: _spacebunnyalpha-src
        run: npm run validate:budget

      - name: Check spacebunnyalpha local server
        working-directory: _spacebunnyalpha-src
        run: python3 scripts/serve-check.py

      # Drives the built game in real Chrome and checks which way the character
      # actually walks for each control. Inverted movement shipped twice through
      # a green build before this existed; the unit tests alone did not catch it
      # because both errors shared a sign convention the checks had assumed
      # rather than verified.
      - name: Check spacebunnyalpha controls in a real browser
        working-directory: _spacebunnyalpha-src
        run: python3 scripts/controls-check.py

      - name: Test Apex GP
        working-directory: _f1-src
        run: |
          npm test

      - name: Validate Kuala Lumpur world budget
        working-directory: _kualalumpur-src
        run: |
          npm run validate:budget

      - name: Build Apex GP
        working-directory: _f1-src
        run: |
          npm ci
          npm run build

      # Apex GP has no dev-only runtime harness beyond node:test, but the suite is
      # the only thing standing between a generated-centrelines change and a circuit
      # that no longer closes, so it gates the deploy rather than running after it.
      - name: Test Apex GP
        working-directory: _f1-src
        run: |
          npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
