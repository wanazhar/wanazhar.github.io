name: Deploy monorepo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Emir's Car World
        working-directory: _emir-src
        run: |
          npm ci
          npm run build

      - name: Build Endless Runner
        working-directory: _endlessrunner-src
        run: |
          npm ci
          npm run build

      - name: Build Kuala Lumpur
        working-directory: _kualalumpur-src
        run: |
          npm ci
          npm run build

      - name: Validate Kuala Lumpur world budget
        working-directory: _kualalumpur-src
        run: |
          npm run validate:budget

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
