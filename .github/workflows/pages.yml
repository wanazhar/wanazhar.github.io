name: Deploy monorepo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Emir's Car World
        working-directory: _emir-src
        run: |
          npm ci
          npm run build

      - name: Test Emir's Car World
        working-directory: _emir-src
        run: npm test

      - name: Build Endless Runner
        working-directory: _endlessrunner-src
        run: |
          npm ci
          npm run build

      - name: Test Endless Runner
        working-directory: _endlessrunner-src
        run: |
          npm test
          npm run lint:imports

      - name: Build Kuala Lumpur
        working-directory: _kualalumpur-src
        run: |
          npm ci
          npm run build

      - name: Test Kuala Lumpur
        working-directory: _kualalumpur-src
        run: |
          npm test
          npm run lint:syntax

      - name: Build Apex GP
        working-directory: _f1-src
        run: |
          npm ci
          npm run build

      # spacebunnyalpha: dev dependencies carry the jsdom-based runtime test,
      # so install them explicitly rather than relying on the ambient NODE_ENV.
      - name: Install spacebunnyalpha
        working-directory: _spacebunnyalpha-src
        run: npm ci --include=dev

      - name: Build spacebunnyalpha
        working-directory: _spacebunnyalpha-src
        run: npm run build

      - name: Test spacebunnyalpha
        working-directory: _spacebunnyalpha-src
        run: npm test

      - name: Lint spacebunnyalpha
        working-directory: _spacebunnyalpha-src
        run: npm run lint

      - name: Validate spacebunnyalpha world budget
        working-directory: _spacebunnyalpha-src
        run: npm run validate:budget

      - name: Check spacebunnyalpha local server
        working-directory: _spacebunnyalpha-src
        run: python3 scripts/serve-check.py

      # controls-check.py is deliberately NOT wired in here. It drives a real
      # Chrome over CDP against a served build, and it broke this deploy three
      # times: once on an unreachable hardcoded Tailscale URL, and once because
      # serve.py backgrounds itself in a way a CI step cannot wait on.
      #
      # It is still valuable, just not as a gate on a shared deploy. Run it
      # locally against a served build before shipping a controls change:
      #
      #   python3 scripts/serve.py --bind 127.0.0.1 --port 4174 \
      #     --dir ../spacebunnyalpha &
      #   SBA_URL=http://127.0.0.1:4174/ python3 scripts/controls-check.py
      #
      # unit-level control coverage lives in scripts/movement-direction.test.js
      # and runs as part of "npm test" above.

      # Apex GP has no dev-only runtime harness beyond node:test, but the suite is
      # the only thing standing between a generated-centrelines change and a circuit
      # that no longer closes, so it gates the deploy rather than running after it.
      #
      # Its build and its install are the pair near the top of this job, with the other
      # projects. Both used to be listed a second time down here, which ran `npm ci`,
      # the build and the whole suite twice on every push for the same answer.
      - name: Test Apex GP
        working-directory: _f1-src
        run: |
          npm test

      - name: Validate Kuala Lumpur world budget
        working-directory: _kualalumpur-src
        run: |
          npm run validate:budget

      # The upload used to be the repository root, which meant everything the
      # checkout left behind was published: five `npm ci` runs leave ~458 MB of
      # node_modules plus every `_*-src` source tree in the workspace, and
      # upload-pages-artifact copied all of it (the live site really served
      # /_emir-src/node_modules/three/package.json). Stage the site content
      # explicitly instead — the store front plus the six published games.
      - name: Stage site
        run: |
          rm -rf _site
          mkdir _site
          cp -R index.html assets images docs CNAME .nojekyll _site/
          cp -R f1 emir endlessrunner kualalumpur spacebunnyalpha doom _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
